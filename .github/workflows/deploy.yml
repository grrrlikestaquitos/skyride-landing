name: Deploy

# Publishes this repo to GitHub Pages at https://www.skyride.app

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: `pages` to publish, `id-token` for its
# OIDC handshake.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `output: "export"` in next.config.ts makes this emit static files into
      # out/. Type errors fail the build.
      - name: Build static export
        run: npm run build

      # Fail loudly here rather than shipping a site with a broken share card
      # or a custom domain that silently reverts to *.github.io.
      #
      # privacy.html and terms.html are load-bearing beyond SEO: the iOS app
      # hard-links to /privacy and /terms from its sign-in and Settings
      # screens, and App Review follows both. A build that drops them ships a
      # dead link inside the app.
      #
      # payments.html is the same kind of promise and a harder one to take
      # back. It fills `managementURL` on the Apple Pay merchant token the app
      # requests, and that URL is stored WITH THE TOKEN in the rider's Wallet
      # when the card is saved. Dropping this page does not just break a link
      # somebody can retry later — it breaks it permanently for every rider who
      # saved a card while it was live.
      - name: Verify export artifacts
        run: |
          for f in index.html 404.html privacy.html terms.html payments.html robots.txt sitemap.xml opengraph-image.png CNAME .nojekyll; do
            test -e "out/$f" || { echo "::error::missing out/$f"; exit 1; }
          done
          grep -q "www.skyride.app" out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
